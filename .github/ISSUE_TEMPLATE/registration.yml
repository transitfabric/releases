name: Bounty registration
description: Register the address you want credit for. Made by the claim page at https://transitfabric.xyz/claim.html.
title: "Bounty registration"
labels: ["bounty-registration"]
body:
  - type: markdown
    attributes:
      value: |
        Fill this in with the claim page (https://transitfabric.xyz/claim.html), which signs a message with your wallet. Signing moves no funds. Never paste a seed phrase or a private key.
        If you want the registration kept private, use the private advisory instead.
  - type: input
    id: github
    attributes:
      label: GitHub username
    validations:
      required: true
  - type: input
    id: address
    attributes:
      label: Address (ss58)
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Message
      description: "Exactly: Transit Fabric bounty: github=<user>, address=<ss58>, date=<YYYY-MM-DD>"
      render: text
    validations:
      required: true
  - type: textarea
    id: signature
    attributes:
      label: Signature (hex)
      render: text
    validations:
      required: true
